name: lint

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.head_ref }}
  cancel-in-progress: true

jobs:
  prettier:
    name: lint-prettier
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up node
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    # - name: Install dependencies
    #   run: npm install

    - name: Prettify code
      run: npx prettier . --check
