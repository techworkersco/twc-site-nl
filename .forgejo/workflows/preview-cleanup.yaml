name: preview-cleanup

on:
  pull_request:
    types: [unlabeled, closed]

enable-openid-connect: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: |
      (forgejo.event.action == 'label_cleared' && forgejo.event.label.name == 'preview') ||
      (forgejo.event.action == 'closed')
    steps:
    - name: Delete Preview Deployment
      env:
        PREVIEW_ROOT: "pr-${{ forgejo.event.pull_request.number }}"
      run: |
        ID_TOKEN=$(curl -Ss -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=forgejo.techwerkers.nl" | jq -r .value)

        echo "Cleaning up preview ${PREVIEW_ROOT} ..."
      curl -X DELETE -H "Authorization: Bearer $ID_TOKEN" "https://preview.techwerkers.nl/delete/${PREVIEW_ROOT}" || true
